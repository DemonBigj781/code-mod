name: Code Complete Pipeline

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish or promote
        required: true
        type: string
      release_type:
        description: Publish a prerelease or promote it to stable
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release

concurrency:
  group: code-complete-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifact:
    name: Create validated artifact
    uses: ./.github/workflows/complete-artifact-creation.yml
    with:
      tag: ${{ inputs.tag }}
      release_type: ${{ inputs.release_type }}
    secrets: inherit
    permissions:
      actions: write
      contents: read

  prerelease:
    name: Publish prerelease
    if: inputs.release_type == 'prerelease'
    needs: artifact
    uses: ./.github/workflows/pre-release-only.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      tag: ${{ inputs.tag }}
    secrets: inherit
    permissions:
      actions: read
      contents: write

  release:
    name: Promote stable release
    if: inputs.release_type == 'release'
    needs: artifact
    uses: ./.github/workflows/release-only.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      tag: ${{ inputs.tag }}
    secrets: inherit
    permissions:
      actions: read
      contents: write
