name: Cosmopolitan Code APE

on:
  push:
    branches:
      - Main
    paths:
      - "code-rs/**"
      - "codex-rs/models-manager/models.json"
      - "announcement_tip.toml"
      - "scripts/build-cosmopolitan-code.sh"
      - "scripts/smoke-test cosmopolitan-code.sh"
      - "scripts/build-cosmopolitan-runtime.sh"
      - "scripts/cosmopolitan-code/**"
      - ".github/workflows/cosmopolitan-code-ape.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-scope:
    name: Test explicit project scope and memory Markdown
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/demonbigj781/cosmopolitan-code-builder@sha256:a76d2a7b9ace2a1ec3d874dd8e0751d0ddb677245459a6e1e864a9940fd66f9b
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust container worktrees
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/o/cosmopolitan-source"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"
      - name: Test registry, bounded discovery, snapshots, reviews, and memory Markdown
        working-directory: code-rs
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(getconf _NPROCESSORS_ONLN)
          cargo +1.93.0 test --locked -p code-core project_registry -j"$jobs"
          cargo +1.93.0 test --locked -p code-core memory_summary -j"$jobs"
          cargo +1.93.0 test --locked -p code-session-history -j"$jobs"
          cargo +1.93.0 test --locked -p code-git-tooling repository_discovery -j"$jobs"
          cargo +1.93.0 test --locked -p code-tui --lib --no-default-features --features code-fork project_registry -j"$jobs"
          cargo +1.93.0 test --locked -p code-tui --lib --no-default-features --features code-fork workspace_snapshot_tests -j"$jobs"
          cargo +1.93.0 test --locked -p code-tui --lib --no-default-features --features code-fork repository_mode_tests -j"$jobs"
          cargo +1.93.0 test --locked -p code-cli --test feature_contract --no-default-features -j"$jobs"
          cargo +1.93.0 check --locked -p code-cli --no-default-features --features debug-logs -j"$jobs"

  runtime:
    name: Build source runtime probe on Linux
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/demonbigj781/cosmopolitan-code-builder@sha256:a76d2a7b9ace2a1ec3d874dd8e0751d0ddb677245459a6e1e864a9940fd66f9b
      options: --privileged
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust container worktrees
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/o/cosmopolitan-source"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"
      - name: Check agent tool schema contracts
        timeout-minutes: 5
        run: |
          jobs=1
          if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then jobs=$(getconf _NPROCESSORS_ONLN); fi
          CARGO_TARGET_DIR="$RUNNER_TEMP/code-agent-contract-target" CARGO_BUILD_JOBS="$jobs" cargo +1.93.0 test --locked --manifest-path scripts/agent-contract-check/Cargo.toml -j"$jobs" -- --test-threads=1
      - name: Read pinned fork revision
        id: fork-pin
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("scripts/cosmopolitan-code/pins.json"))["cosmopolitan_commit"])')" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DemonBigj781/cosmopolitan
          ref: ${{ steps.fork-pin.outputs.sha }}
          path: o/cosmopolitan-source
      - name: Enable APE for source-built fork helpers
        run: sh scripts/cosmopolitan-code/enable-ape-ci.sh
      - name: Test artifact and command contracts
        run: |
          python3 -m unittest discover -s scripts/cosmopolitan-code/tests -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s o/cosmopolitan-source/third_party/rust_ape/tests -p 'test_*.py'
      - name: Build and test the source runtime
        run: sh scripts/build-cosmopolitan-runtime.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-runtime-probe
          path: o/cosmopolitan-runtime/*
          if-no-files-found: error
          retention-days: 14

  runtime-windows:
    name: Test source runtime probe on Windows
    if: github.ref == 'refs/heads/Main'
    needs: runtime
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosmopolitan-runtime-probe
          path: o/cosmopolitan-runtime
      - name: Verify and run the identical runtime probe
        shell: pwsh
        run: |
          python scripts/cosmopolitan-code/verify_runtime_probe.py o/cosmopolitan-runtime $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Resolve-Path 'o/cosmopolitan-runtime/runtime-smoke.com').Path --native-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    name: Build APE on Linux
    if: github.ref == 'refs/heads/Main'
    needs:
      - project-scope
      - runtime-windows
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/demonbigj781/cosmopolitan-code-builder@sha256:a76d2a7b9ace2a1ec3d874dd8e0751d0ddb677245459a6e1e864a9940fd66f9b
      options: --privileged
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust container worktrees
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/o/cosmopolitan-source"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"
      - name: Test native Rustwright MCP integration
        working-directory: code-rs
        run: |
          cargo test --locked -p code-rustwright-mcp
          cargo test --locked -p code-core --features browser-automation rustwright_mcp::tests::
      - name: Read pinned fork revision
        id: fork-pin
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("scripts/cosmopolitan-code/pins.json"))["cosmopolitan_commit"])')" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DemonBigj781/cosmopolitan
          ref: ${{ steps.fork-pin.outputs.sha }}
          path: o/cosmopolitan-source
      - name: Enable APE for source-built fork helpers
        run: sh scripts/cosmopolitan-code/enable-ape-ci.sh
      - name: Build and package the x86-64 APE on Linux
        run: sh scripts/build-cosmopolitan-code.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-code-ape
          path: o/cosmopolitan-code/*
          if-no-files-found: error
          retention-days: 14

  linux-smoke:
    name: Run APE on Linux
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosmopolitan-code-ape
          path: o/cosmopolitan-code
      - name: Smoke-test the x86-64 APE on Linux
        run: sh 'scripts/smoke-test cosmopolitan-code.sh' o/cosmopolitan-code
      - name: Smoke-test embedded Camoufox through Rustwright MCP
        continue-on-error: true
        run: python3 scripts/cosmopolitan-code/check-rustwright-mcp.py o/cosmopolitan-code/code.com --exercise-browser

  termux-bionic-smoke:
    name: Run same APE in Termux Bionic userland
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosmopolitan-code-ape
          path: o/cosmopolitan-code
      - name: Restore executable bits lost by artifact upload
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 o/cosmopolitan-code/*.com
      - name: Smoke-test the x86-64 APE in Termux
        shell: bash
        env:
          TERMUX_IMAGE: termux/termux-docker-pacman@sha256:e122eb8cf4309859f797d9618c378016af7dbd695817bd5915194e7c6d2dd406
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$TERMUX_IMAGE" \
            bash -lc '
              set -Eeuo pipefail
              timeout --foreground 10m pacman -Sy --noconfirm
              timeout --foreground 10m pacman -S --noconfirm --needed file python termux-exec
              termux_exec_preload="${PREFIX}/lib/libtermux-exec-ld-preload.so"
              if [ -r "$termux_exec_preload" ]; then
                export LD_PRELOAD="$termux_exec_preload"
              fi
              export TERMUX_VERSION="${TERMUX_VERSION:-ci-docker}"
              sh "scripts/smoke-test cosmopolitan-code.sh" o/cosmopolitan-code
            '

  windows-smoke:
    name: Run same APE on Windows
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosmopolitan-code-ape
          path: o/cosmopolitan-code
      - name: Verify the manifest and run the same APE on Windows
        shell: pwsh
        run: |
          $artifact = (Resolve-Path 'o/cosmopolitan-code/code.com').Path
          $manifest = (Resolve-Path 'o/cosmopolitan-code/code.com.json').Path
          python scripts/cosmopolitan-code/artifact_contract.py $artifact $manifest --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Resolve-Path 'o/cosmopolitan-code/runtime-smoke.com').Path --native-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --help > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cosmopolitan-code/check-rustwright-mcp.py $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cosmopolitan-code/check-history-worker.py $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
