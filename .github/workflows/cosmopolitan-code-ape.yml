name: Cosmopolitan Code APE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APE on Linux
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check agent tool schema contracts
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          jobs=1
          if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then jobs=$(getconf _NPROCESSORS_ONLN); fi
          CARGO_TARGET_DIR="$RUNNER_TEMP/code-agent-contract-target" CARGO_BUILD_JOBS="$jobs" cargo +1.93.0 test --locked --manifest-path scripts/agent-contract-check/Cargo.toml -j"$jobs" -- --test-threads=1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DemonBigj781/cosmopolitan
          ref: c929496a7ae420a3a8fc1ca12cd4b687e80d653d
          path: o/cosmopolitan-source
      - name: Enable APE for source-built fork helpers
        run: |
          sudo install -m 0755 o/cosmopolitan-source/build/bootstrap/ape.elf /usr/bin/ape
          if [ ! -e /proc/sys/fs/binfmt_misc/register ]; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          if [ ! -e /proc/sys/fs/binfmt_misc/APE ]; then
            printf '%s\n' ':APE:M::MZqFpD::/usr/bin/ape:' | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          fi
          if [ ! -e /proc/sys/fs/binfmt_misc/APE-jart ]; then
            printf '%s\n' ':APE-jart:M::jartsr::/usr/bin/ape:' | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          fi
      - name: Test artifact and command contracts
        run: |
          python3 -m unittest discover -s scripts/cosmopolitan-code/tests -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s o/cosmopolitan-source/third_party/rust_ape/tests -p 'test_*.py'
      - name: Build and smoke-test the x86-64 APE on Linux
        run: sh scripts/build-cosmopolitan-code.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-code-ape
          path: o/cosmopolitan-code/*
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Run same APE on Windows
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosmopolitan-code-ape
          path: o/cosmopolitan-code
      - name: Verify the manifest and run the same APE on Windows
        shell: pwsh
        run: |
          $artifact = (Resolve-Path 'o/cosmopolitan-code/code.com').Path
          $manifest = (Resolve-Path 'o/cosmopolitan-code/code.com.json').Path
          python scripts/cosmopolitan-code/artifact_contract.py $artifact $manifest --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Resolve-Path 'o/cosmopolitan-code/runtime-smoke.com').Path --native-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --help > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cosmopolitan-code/check-history-worker.py $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
