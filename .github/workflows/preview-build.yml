name: Build Code

on:
  push:
    branches:
      - main
    paths:
      - "code-rs/**"
      - ".github/workflows/preview-build.yml"

concurrency:
  group: build-code-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ARTIFACT_NAME: code-linux-x86_64-${{ github.run_number }}
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/code-rs/target
      RUSTUP_HOME: ${{ github.workspace }}/.cargo-home/rustup
      RUST_WORKSPACE_DIR: code-rs
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Rust toolchain
        id: rust_toolchain
        shell: sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' code-rs/rust-toolchain.toml | head -n 1)
          if [ -z "$channel" ]; then
            echo "Unable to read the Rust channel from code-rs/rust-toolchain.toml" >&2
            exit 1
          fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: ${{ env.TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: code-linux-x86_64
          shared-key: rust-${{ steps.rust_toolchain.outputs.channel }}
          workspaces: code-rs -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure build cache
        shell: sh
        run: |
          set -eu
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: sh
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
          {
            echo 'CC=clang'
            echo 'CXX=clang++'
            echo 'OPENSSL_NO_VENDOR=1'
            echo 'RUSTFLAGS=-C debuginfo=0 -C strip=symbols -C panic=abort'
          } >> "$GITHUB_ENV"

      - name: Prefetch dependencies
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked

      - name: Build release binary
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        run: cargo build --release --frozen --locked --target "$TARGET" --bin code

      - name: Smoke test binary
        shell: sh
        run: |
          set -eu
          executable="$RUST_WORKSPACE_DIR/target/$TARGET/release/code"
          "$executable" --version
          "$executable" completion bash >/dev/null

      - name: Stage artifact
        shell: sh
        run: |
          set -eu
          mkdir -p artifacts
          cp "$RUST_WORKSPACE_DIR/target/$TARGET/release/code" artifacts/code
          chmod +x artifacts/code
          (cd artifacts && sha256sum code > code.sha256)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize artifact
        shell: sh
        run: |
          set -eu
          {
            echo '### Code Linux build'
            echo ''
            printf '%s\n' "- Target: \`$TARGET\`"
            printf '%s\n' "- Artifact: \`$ARTIFACT_NAME\`"
            printf '%s\n' '- Contents: code, code.sha256'
          } >> "$GITHUB_STEP_SUMMARY"
