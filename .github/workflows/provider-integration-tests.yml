name: Provider Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - "code-rs/**"
      - "docs/config.md"
      - "docs/settings.md"
      - "docs/slash-commands.md"
      - ".github/workflows/provider-integration-tests.yml"

concurrency:
  group: provider-integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test direct provider integration
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/code-rs/target
      RUSTUP_HOME: ${{ github.workspace }}/.cargo-home/rustup
      RUST_WORKSPACE_DIR: code-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Rust toolchain
        id: rust_toolchain
        shell: sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' code-rs/rust-toolchain.toml | head -n 1)
          if [ -z "$channel" ]; then
            echo "Unable to read the Rust channel from code-rs/rust-toolchain.toml" >&2
            exit 1
          fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Cache provider tests
        uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: code-provider-integration-tests
          shared-key: rust-${{ steps.rust_toolchain.outputs.channel }}
          workspaces: code-rs -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure compiler cache
        shell: sh
        run: |
          set -eu
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"

      - name: Install Linux test dependencies
        shell: sh
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
          {
            echo 'CC=clang'
            echo 'CXX=clang++'
            echo 'OPENSSL_NO_VENDOR=1'
          } >> "$GITHUB_ENV"

      - name: Prefetch dependencies
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked

      - name: Test direct provider core behavior
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        shell: sh
        run: |
          set -eu
          cargo test --frozen --locked -j1 -p code-core direct_model_provider_ -- --nocapture
          cargo test --frozen --locked -j1 -p code-core --test remote_models_manager remote_models_provider_ -- --nocapture

      - name: Test direct provider TUI behavior
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        shell: sh
        run: cargo test --frozen --locked -j1 -p code-tui direct_provider_endpoint_ -- --nocapture

      - name: Check provider config compatibility
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        shell: sh
        run: |
          set -eu
          cargo test --frozen --locked -j1 -p code-core checked_in_codex_schema_matches_generated -- --exact
          cargo test --frozen --locked -j1 -p code-app-server message_processor::tests::config_write_preserves_existing_table_config -- --exact
