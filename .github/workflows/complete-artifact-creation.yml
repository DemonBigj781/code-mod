name: Complete Artifact Creation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Fork-marked artifact version (X.Y.Zb)
        required: true
        type: string
      release_type:
        description: Build prerelease or stable version metadata
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
  workflow_call:
    inputs:
      tag:
        description: Fork-marked artifact version (X.Y.Zb)
        required: true
        type: string
      release_type:
        description: Build prerelease or stable version metadata
        required: false
        default: prerelease
        type: string

concurrency:
  group: complete-artifact-creation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate artifact inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate release type
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.release_type }}" in
            prerelease|release) ;;
            *)
              echo "release_type must be prerelease or release" >&2
              exit 1
              ;;
          esac

  check:
    name: Check source
    needs: validate-inputs
    uses: ./.github/workflows/check-only.yml
    secrets: inherit
    permissions:
      contents: read

  test:
    name: Test source
    needs: validate-inputs
    uses: ./.github/workflows/test-only.yml
    secrets: inherit
    permissions:
      contents: read

  build:
    name: Build and validate code.com
    needs:
      - check
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUTPUT_DIR: ${{ github.workspace }}/o/cosmopolitan-code/${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Attach exact source revision to Main
        shell: bash
        run: git switch -C Main "$GITHUB_SHA"
      - name: Dispatch and download canonical cross-platform build
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python3 scripts/cosmopolitan-code/commands.py build-action
            --output "$OUTPUT_DIR"
            --mod-version "${{ inputs.tag }}"
          )
          if [[ "${{ inputs.release_type }}" == prerelease ]]; then
            args+=(--build-attempt-count "$GITHUB_RUN_ATTEMPT")
          fi
          "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code.com
          path: |
            ${{ env.OUTPUT_DIR }}/code.com
            ${{ env.OUTPUT_DIR }}/code.com.json
          if-no-files-found: error
          retention-days: 14
