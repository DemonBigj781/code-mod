name: Complete Artifact Creation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Fork-marked artifact version (X.Y.Zb)
        required: false
        type: string
      release_type:
        description: Build prerelease or stable version metadata
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
      build_attempt_count:
        description: Positive attempt count to expose in prerelease version output
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Fork-marked artifact version (X.Y.Zb)
        required: false
        default: ""
        type: string
      release_type:
        description: Build prerelease or stable version metadata
        required: false
        default: prerelease
        type: string
      build_attempt_count:
        description: Positive attempt count to expose in prerelease version output
        required: false
        default: ""
        type: string

concurrency:
  group: complete-artifact-creation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate artifact inputs
    runs-on: ubuntu-latest
    outputs:
      build_attempt_count: ${{ steps.version.outputs.build_attempt_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Resolve artifact version inputs
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REQUESTED_BUILD_ATTEMPT_COUNT: ${{ inputs.build_attempt_count }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$RELEASE_TYPE" in
            prerelease|release) ;;
            *)
              echo "release_type must be prerelease or release" >&2
              exit 1
              ;;
          esac
          if [[ -n "$TAG" ]]; then
            PYTHONPATH=scripts/cosmopolitan-code python3 - "$TAG" <<'PY'
          import sys
          from commands import normalize_mod_version

          normalize_mod_version(sys.argv[1])
          PY
          fi
          build_attempt_count=
          if [[ -n "$REQUESTED_BUILD_ATTEMPT_COUNT" ]]; then
            if [[ -z "$TAG" || "$RELEASE_TYPE" != prerelease ]]; then
              echo "build_attempt_count requires a prerelease tag" >&2
              exit 1
            fi
            if [[ ! "$REQUESTED_BUILD_ATTEMPT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "build_attempt_count must be a positive integer" >&2
              exit 1
            fi
            build_attempt_count=$REQUESTED_BUILD_ATTEMPT_COUNT
          elif [[ -n "$TAG" && "$RELEASE_TYPE" == prerelease ]]; then
            build_attempt_count=$RUN_ATTEMPT
          fi
          printf 'build_attempt_count=%s\n' "$build_attempt_count" >> "$GITHUB_OUTPUT"

  check:
    name: Check source
    needs: validate-inputs
    uses: ./.github/workflows/check-only.yml
    secrets: inherit
    permissions:
      contents: read

  test:
    name: Test source
    needs: validate-inputs
    uses: ./.github/workflows/test-only.yml
    secrets: inherit
    permissions:
      contents: read

  build:
    name: Build code.com once
    needs:
      - validate-inputs
      - check
      - test
    uses: ./.github/workflows/compile-only.yml
    with:
      mod_version: ${{ inputs.tag }}
      build_attempt_count: ${{ needs.validate-inputs.outputs.build_attempt_count }}
    secrets: inherit
    permissions:
      contents: read

  linux-smoke:
    name: Run APE on Linux
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code.com
          path: o/cosmopolitan-code
      - name: Smoke-test the x86-64 APE on Linux
        run: sh 'scripts/smoke-test cosmopolitan-code.sh' o/cosmopolitan-code
      - name: Smoke-test embedded Camoufox through Rustwright MCP
        continue-on-error: true
        run: python3 scripts/cosmopolitan-code/check-rustwright-mcp.py o/cosmopolitan-code/code.com --exercise-browser

  termux-bionic-smoke:
    name: Run same APE in Termux Bionic userland
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code.com
          path: o/cosmopolitan-code
      - name: Restore executable bits lost by artifact upload
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 o/cosmopolitan-code/*.com
      - name: Smoke-test the x86-64 APE in Termux
        shell: bash
        env:
          TERMUX_IMAGE: termux/termux-docker-pacman@sha256:e122eb8cf4309859f797d9618c378016af7dbd695817bd5915194e7c6d2dd406
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$TERMUX_IMAGE" \
            bash -lc '
              set -Eeuo pipefail
              timeout --foreground 10m pacman -Sy --noconfirm
              timeout --foreground 10m pacman -S --noconfirm --needed file python termux-exec
              termux_exec_preload="${PREFIX}/lib/libtermux-exec-ld-preload.so"
              if [ -r "$termux_exec_preload" ]; then
                export LD_PRELOAD="$termux_exec_preload"
              fi
              export TERMUX_VERSION="${TERMUX_VERSION:-ci-docker}"
              sh "scripts/smoke-test cosmopolitan-code.sh" o/cosmopolitan-code
            '

  windows-smoke:
    name: Run same APE on Windows
    if: github.ref == 'refs/heads/Main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code.com
          path: o/cosmopolitan-code
      - name: Verify the manifest and run the same APE on Windows
        shell: pwsh
        run: |
          $artifact = (Resolve-Path 'o/cosmopolitan-code/code.com').Path
          $manifest = (Resolve-Path 'o/cosmopolitan-code/code.com.json').Path
          python scripts/cosmopolitan-code/artifact_contract.py $artifact $manifest --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Resolve-Path 'o/cosmopolitan-code/runtime-smoke.com').Path --native-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --help > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cosmopolitan-code/check-rustwright-mcp.py $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cosmopolitan-code/check-history-worker.py $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
