name: Compile Only

on:
  workflow_dispatch:
    inputs:
      mod_version:
        description: Code-mod version to embed (X.Y.Zb, newer than 0.6.196)
        required: false
        type: string
      build_attempt_count:
        description: Positive attempt count to expose in prerelease version output
        required: false
        type: string
  workflow_call:
    inputs:
      mod_version:
        description: Code-mod version to embed (X.Y.Zb, newer than 0.6.196)
        required: false
        default: ""
        type: string
      build_attempt_count:
        description: Positive attempt count to expose in prerelease version output
        required: false
        default: ""
        type: string

concurrency:
  group: compile-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Build portable code.com artifact
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/demonbigj781/cosmopolitan-code-builder@sha256:a76d2a7b9ace2a1ec3d874dd8e0751d0ddb677245459a6e1e864a9940fd66f9b
      options: --privileged
    timeout-minutes: 180
    env:
      CODE_MOD_VERSION: ${{ inputs.mod_version || '' }}
      CODE_BUILD_ATTEMPT_COUNT: ${{ inputs.build_attempt_count || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust container worktrees
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/o/cosmopolitan-source"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"
      - name: Read pinned fork revision
        id: fork-pin
        shell: bash
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("scripts/cosmopolitan-code/pins.json"))["cosmopolitan_commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DemonBigj781/cosmopolitan
          ref: ${{ steps.fork-pin.outputs.sha }}
          path: o/cosmopolitan-source
      - name: Enable APE for source-built fork helpers
        run: sh scripts/cosmopolitan-code/enable-ape-ci.sh
      - name: Build and package code.com
        run: sh scripts/build-cosmopolitan-code.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code.com
          path: |
            o/cosmopolitan-code/code.com
            o/cosmopolitan-code/code.com.json
            o/cosmopolitan-code/runtime-smoke.com
          if-no-files-found: error
          retention-days: 14
