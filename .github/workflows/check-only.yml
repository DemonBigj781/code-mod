name: Check Only

on:
  workflow_dispatch:

concurrency:
  group: check-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check product and test targets
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/demonbigj781/cosmopolitan-code-builder@sha256:a76d2a7b9ace2a1ec3d874dd8e0751d0ddb677245459a6e1e864a9940fd66f9b
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust container worktree
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"
      - name: Check product targets
        working-directory: code-rs
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(getconf _NPROCESSORS_ONLN)
          cargo +1.93.0 check --locked -p code-core --all-targets -j"$jobs"
          cargo +1.93.0 check --locked -p code-core --all-targets --features browser-automation -j"$jobs"
          cargo +1.93.0 check --locked -p code-rustwright-mcp --all-targets -j"$jobs"
          cargo +1.93.0 check --locked -p code-tui --all-targets --no-default-features --features code-fork -j"$jobs"
          cargo +1.93.0 check --locked -p code-cli --all-targets --no-default-features --features debug-logs -j"$jobs"
          cargo +1.93.0 check --locked -p codex-utils-image -p code-session-history -p code-git-tooling --all-targets -j"$jobs"
      - name: Check agent tool schema tests compile
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(getconf _NPROCESSORS_ONLN)
          CARGO_TARGET_DIR="$RUNNER_TEMP/code-agent-contract-target" CARGO_BUILD_JOBS="$jobs" cargo +1.93.0 test --locked --no-run --manifest-path scripts/agent-contract-check/Cargo.toml -j"$jobs"
