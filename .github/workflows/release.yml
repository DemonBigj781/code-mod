name: Release

on:
  push:
    branches:
      - main
    # Workflow changes intentionally trigger a release validation run.
    paths-ignore:
      - ".github/workflows/issue-triage.yml"
      - ".github/workflows/preview-build.yml"
      - ".github/workflows/upstream-merge.yml"
      - "examples/**"
      - "**/*.test.ts"
      - "test/**"
      - "docs/**"
      - "*.md"
      - "CHANGELOG.md"
      - "codex-cli/package.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: "1"

jobs:
  preflight-tests:
    name: Preflight Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: /mnt/cargo-target
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Rust toolchain channel
        id: rust_toolchain
        shell: sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' code-rs/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Install Linux build dependencies
        shell: sh
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
          sudo mkdir -p "$CARGO_TARGET_DIR"
          sudo chown "$USER":"$USER" "$CARGO_TARGET_DIR"
          {
            echo 'CC=clang'
            echo 'CXX=clang++'
            echo 'OPENSSL_NO_VENDOR=1'
          } >> "$GITHUB_ENV"

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v6-release-preflight
          shared-key: ${{ steps.rust_toolchain.outputs.channel }}
          workspaces: |
            code-rs -> target
          cache-targets: false
          cache-workspace-crates: true

      - name: Build CLI
        working-directory: code-rs
        run: cargo build --locked -j1 --profile dev-fast --bin code

      - name: Run CLI smoke suite
        env:
          CI_CLI_BIN: ${{ env.CARGO_TARGET_DIR }}/dev-fast/code
          SKIP_CARGO_TESTS: "1"
        run: bash scripts/ci-tests.sh

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run workspace tests
        working-directory: code-rs
        run: cargo nextest run --no-fail-fast --locked

  determine-version:
    name: Determine Version
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the next GitHub release version
        id: version
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          current=$(python3 -c 'import json; print(json.load(open("codex-cli/package.json"))["version"])')
          case "$current" in
            *[!0-9.]*|*.*.*.*|.*|*.)
              echo "Invalid package version: $current" >&2
              exit 1
              ;;
          esac

          head_tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -n "$head_tag" ]; then
            version=${head_tag#v}
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$head_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            candidate=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          else
            candidate=$current
          fi

          release_tags=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name')
          while git rev-parse -q --verify "refs/tags/v$candidate" > /dev/null || \
            printf '%s\n' "$release_tags" | grep -Fqx "v$candidate"
          do
            major=$(printf '%s' "$candidate" | cut -d. -f1)
            minor=$(printf '%s' "$candidate" | cut -d. -f2)
            patch=$(printf '%s' "$candidate" | cut -d. -f3)
            candidate="$major.$minor.$((patch + 1))"
          done

          echo "version=$candidate" >> "$GITHUB_OUTPUT"
          echo "tag=v$candidate" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs:
      - determine-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: code-x86_64-unknown-linux-gnu
            enabled: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: code-aarch64-unknown-linux-gnu
            enabled: true
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: code-x86_64-apple-darwin
            enabled: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: code-aarch64-apple-darwin
            enabled: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: code-x86_64-pc-windows-msvc.exe
            enabled: true
    steps:
      - name: Check out repository
        if: matrix.enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Rust toolchain channel
        if: matrix.enabled
        id: rust_toolchain
        shell: sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' code-rs/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: matrix.enabled
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.enabled && runner.os == 'Linux'
        shell: sh
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
          {
            echo 'CC=clang'
            echo 'CXX=clang++'
            echo 'OPENSSL_NO_VENDOR=1'
            echo 'RUSTFLAGS=-Awarnings -C debuginfo=0 -C strip=symbols -C panic=abort'
          } >> "$GITHUB_ENV"

      - name: Configure macOS compiler
        if: matrix.enabled && runner.os == 'macOS'
        shell: sh
        run: echo 'RUSTFLAGS=-C debuginfo=0 -C strip=symbols -C panic=abort' >> "$GITHUB_ENV"

      - name: Configure Windows compiler
        if: matrix.enabled && runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBGIT2_SYS_USE_SCHANNEL=1" >> $env:GITHUB_ENV
          "CURL_SSL_BACKEND=schannel" >> $env:GITHUB_ENV
          "RUSTFLAGS=-C debuginfo=0 -C strip=symbols -C panic=abort" >> $env:GITHUB_ENV

      - name: Set up Rust cache
        if: matrix.enabled
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v6-release
          shared-key: ${{ matrix.target }}-${{ steps.rust_toolchain.outputs.channel }}
          workspaces: |
            code-rs -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Export release version
        if: matrix.enabled
        shell: sh
        run: echo "CODE_VERSION=${{ needs.determine-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Fetch locked dependencies
        if: matrix.enabled
        working-directory: code-rs
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked

      - name: Build release binary
        if: matrix.enabled
        working-directory: code-rs
        run: cargo build --release --frozen --locked -j1 --target ${{ matrix.target }} --bin code

      - name: Smoke test binary on Unix
        if: |
          matrix.enabled &&
          ((runner.os == 'Linux') ||
          (runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'))
        shell: sh
        run: |
          set -eu
          executable="code-rs/target/${{ matrix.target }}/release/code"
          "$executable" --version
          "$executable" completion bash > /dev/null

      - name: Smoke test binary on Windows
        if: matrix.enabled && runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = "code-rs/target/${{ matrix.target }}/release/code.exe"
          & $executable --version | Out-Null
          & $executable completion bash | Out-Null

      - name: Prepare Unix release archive
        if: matrix.enabled && runner.os != 'Windows'
        shell: sh
        run: |
          set -eu
          mkdir -p artifacts
          cp "code-rs/target/${{ matrix.target }}/release/code" "artifacts/${{ matrix.artifact }}"
          tar -C artifacts -czf "artifacts/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          rm "artifacts/${{ matrix.artifact }}"

      - name: Prepare Windows release archive
        if: matrix.enabled && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "code-rs/target/${{ matrix.target }}/release/code.exe" "artifacts/${{ matrix.artifact }}"
          Compress-Archive -Path "artifacts/${{ matrix.artifact }}" -DestinationPath "artifacts/${{ matrix.artifact }}.zip" -Force
          Remove-Item "artifacts/${{ matrix.artifact }}" -Force

      - name: Upload release archive
        if: matrix.enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs:
      - determine-version
      - build-binaries
      - preflight-tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets and generate checksums
        shell: sh
        run: |
          set -eu
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          (
            cd release-assets
            sha256sum ./* > SHA256SUMS
          )
          cat release-assets/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: Code ${{ needs.determine-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
