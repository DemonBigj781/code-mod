name: SSH Regression Tests

on:
  push:
    branches:
      - Main
      - main
    paths:
      - "code-rs/core/src/codex/exec_tool.rs"
      - "code-rs/core/src/ssh_registry.rs"
      - "code-rs/core/src/tools/handlers/ssh.rs"
      - ".github/workflows/ssh-tests.yml"
  workflow_dispatch:

concurrency:
  group: ssh-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test SSH and build Code
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/code-rs/target
      RUSTUP_HOME: ${{ github.workspace }}/.cargo-home/rustup
      RUST_WORKSPACE_DIR: code-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Rust toolchain
        id: rust_toolchain
        shell: sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' code-rs/rust-toolchain.toml | head -n 1)
          if [ -z "$channel" ]; then
            echo "Unable to read the Rust channel from code-rs/rust-toolchain.toml" >&2
            exit 1
          fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: code-ssh-tests
          shared-key: rust-${{ steps.rust_toolchain.outputs.channel }}
          workspaces: code-rs -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure compiler cache
        shell: sh
        run: |
          set -eu
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_IDLE_TIMEOUT=1800'
            echo 'SCCACHE_CACHE_SIZE=10G'
          } >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: sh
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
          {
            echo 'CC=clang'
            echo 'CXX=clang++'
            echo 'OPENSSL_NO_VENDOR=1'
          } >> "$GITHUB_ENV"

      - name: Prefetch dependencies
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo fetch --locked

      - name: Test SSH registry and transport behavior
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        run: cargo test --frozen --locked -j1 -p code-core tools::handlers::ssh::tests -- --nocapture

      - name: Build release binary
        working-directory: ${{ env.RUST_WORKSPACE_DIR }}
        run: cargo build --frozen --locked --release -j1 -p code-cli

      - name: Upload Code binary
        uses: actions/upload-artifact@v6
        with:
          name: code-ssh-linux-x86_64
          path: code-rs/target/release/code
          if-no-files-found: error
          retention-days: 7
