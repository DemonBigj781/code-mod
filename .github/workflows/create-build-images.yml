name: Create build images

on:
  push:
    branches:
      - Main
    paths:
      - ".github/build-images/cosmopolitan-code/**"
      - ".github/workflows/create-build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: create-build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cosmopolitan-code:
    name: Publish Cosmopolitan Code builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        name: Resolve image name
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/cosmopolitan-code-builder" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=ubuntu-24.04
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/Main' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/build-images/cosmopolitan-code
          file: .github/build-images/cosmopolitan-code/Dockerfile
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=cosmopolitan-code-builder
          cache-to: type=gha,mode=max,scope=cosmopolitan-code-builder
