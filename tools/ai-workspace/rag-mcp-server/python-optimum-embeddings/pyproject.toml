[project]
name = "rag-optimum-embeddings"
version = "0.1.0"
description = "Local embedding service for the RAG MCP server using Optimum and ONNX Runtime."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "transformers>=4.47",
  "optimum[onnxruntime]>=1.27",
  "torch>=2.5",
  "onnxruntime-directml; platform_system == 'Windows'",
  "onnxruntime; platform_system != 'Windows'"
]
